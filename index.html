<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Infrastructure Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; margin: 0; }
        .box { width: 100%; max-width: 900px; background: #1e293b; padding: 24px; border-radius: 10px; border: 1px solid #334155; }
        h1 { margin: 0 0 6px 0; font-size: 22px; }
        .subtitle { color: #94a3b8; margin: 0 0 20px 0; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .room-btn { padding: 13px 14px; background: #334155; color: #f8fafc; border: 2px solid #475569; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: left; font-size: 14px; }
        .room-btn:hover { background: #475569; }
        .room-btn.active { background: #2563eb; border-color: #93c5fd; }
        .panel { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
        .add-btn { padding: 14px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .add-btn:hover { background: #15803d; }
        .rem-btn { padding: 14px; background: #dc2626; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .rem-btn:hover:not(:disabled) { background: #b91c1c; }
        .rem-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }
        .drops-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
        .drop-card { background: #1e293b; padding: 10px 12px; border-radius: 6px; border: 1px solid #334155; font-size: 14px; }
        .report-box { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        .report-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        .download-btn { padding: 12px 24px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .download-btn:hover { background: #0369a1; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #334155; text-align: left; }
        th { background: #1e293b; color: #cbd5e1; }
        td.num, th.num { text-align: right; }
        tr.total-row td { background: #1e293b; font-weight: bold; color: #38bdf8; border-top: 2px solid #475569; }

        @media print {
            body { background: #ffffff !important; color: #000000 !important; padding: 0 !important; display: block !important; }
            .box { background: #ffffff !important; border: none !important; padding: 0 !important; max-width: 100% !important; }
            h1, .subtitle, .grid, .panel, .download-btn { display: none !important; }
            .report-box { background: #ffffff !important; border: none !important; padding: 10px !important; }
            .report-header h3 { color: #000000 !important; font-size: 18px !important; margin-bottom: 12px !important; }
            table { border: 1px solid #cccccc !important; }
            th { background: #f1f5f9 !important; color: #000000 !important; border-bottom: 2px solid #94a3b8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            td { color: #000000 !important; border-bottom: 1px solid #cbd5e1 !important; }
            tr.total-row td { background: #e2e8f0 !important; color: #000000 !important; border-top: 2px solid #64748b !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Network Infrastructure Manager</h1>
    <p class="subtitle">Select a location below, then add or remove Ethernet Drops.</p>

    <div class="grid" id="roomMenu">
        <button type="button" class="room-btn active" data-id="c1">Classroom 1 (0)</button>
        <button type="button" class="room-btn" data-id="c2">Classroom 2 (0)</button>
        <button type="button" class="room-btn" data-id="c3">Classroom 3 (0)</button>
        <button type="button" class="room-btn" data-id="c4">Classroom 4 (0)</button>
        <button type="button" class="room-btn" data-id="c5">Classroom 5 (0)</button>
        <button type="button" class="room-btn" data-id="c6">Classroom 6 (0)</button>
        <button type="button" class="room-btn" data-id="c7">Classroom 7 (0)</button>
        <button type="button" class="room-btn" data-id="c8">Classroom 8 (0)</button>
        <button type="button" class="room-btn" data-id="c9">Classroom 9 (0)</button>
        <button type="button" class="room-btn" data-id="c10">Classroom 10 (0)</button>
        <button type="button" class="room-btn" data-id="c11">Classroom 11 (0)</button>
        <button type="button" class="room-btn" data-id="c12">Classroom 12 (0)</button>
        <button type="button" class="room-btn" data-id="c13">Classroom 13 (0)</button>
        <button type="button" class="room-btn" data-id="c14">Classroom 14 (0)</button>
        <button type="button" class="room-btn" data-id="teachers">Teachers' Lounge (0)</button>
        <button type="button" class="room-btn" data-id="secretariat">Secretariat Office (0)</button>
        <button type="button" class="room-btn" data-id="coord1">Fernanda / Roberval Office (0)</button>
        <button type="button" class="room-btn" data-id="coord2">Talita / Julio Office (0)</button>
        <button type="button" class="room-btn" data-id="coord3">Rog&eacute;rio / Ana Office (0)</button>
        <button type="button" class="room-btn" data-id="principal">Principal's Office (0)</button>
        <button type="button" class="room-btn" data-id="proati">PROATI Room (0)</button>
        <button type="button" class="room-btn" data-id="resource">Resource Room (0)</button>
        <button type="button" class="room-btn" data-id="appendice">Appendice Room (0)</button>
    </div>

    <div class="panel">
        <h2 id="selectedTitle" style="margin:0; font-size: 18px;">Selected: Classroom 1 (0 Ethernet Drops)</h2>
        <div class="actions">
            <button type="button" class="add-btn" id="btnAdd">+ Add Ethernet Drop</button>
            <button type="button" class="rem-btn" id="btnRemove" disabled>- Remove Ethernet Drop</button>
        </div>
        <div class="drops-grid" id="dropsView"></div>
    </div>

    <div class="report-box">
        <div class="report-header">
            <h3 id="reportTitle" style="margin:0; font-size: 16px;">Network Infrastructure Report</h3>
            <button type="button" class="download-btn" id="btnDownload">Download</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Location</th>
                    <th class="num">Ethernet Drops</th>
                </tr>
            </thead>
            <tbody id="reportBody"></tbody>
        </table>
    </div>
</div>

<script>
    var roomKeys = [
        "c1", "c2", "c3", "c4", "c5", "c6", "c7",
        "c8", "c9", "c10", "c11", "c12", "c13", "c14",
        "teachers", "secretariat", "coord1", "coord2",
        "coord3", "principal", "proati", "resource", "appendice"
    ];

    var roomNames = {
        c1: "Classroom 1", c2: "Classroom 2", c3: "Classroom 3", c4: "Classroom 4",
        c5: "Classroom 5", c6: "Classroom 6", c7: "Classroom 7", c8: "Classroom 8",
        c9: "Classroom 9", c10: "Classroom 10", c11: "Classroom 11", c12: "Classroom 12",
        c13: "Classroom 13", c14: "Classroom 14",
        teachers: "Teachers' Lounge",
        secretariat: "Secretariat Office",
        coord1: "Fernanda / Roberval Office",
        coord2: "Talita / Julio Office",
        coord3: "Rog\u00e9rio / Ana Office",
        principal: "Principal's Office",
        proati: "PROATI Room",
        resource: "Resource Room",
        appendice: "Appendice Room"
    };

    var counts = {};
    for (var i = 0; i < roomKeys.length; i++) {
        counts[roomKeys[i]] = 0;
    }

    try {
        var saved = localStorage.getItem("network_drops_v7");
        if (saved) {
            var parsed = JSON.parse(saved);
            for (var k = 0; k < roomKeys.length; k++) {
                var key = roomKeys[k];
                if (typeof parsed[key] === "number") {
                    counts[key] = parsed[key];
                }
            }
        }
    } catch (e) {}

    var selectedId = "c1";

    function saveLocal() {
        try {
            localStorage.setItem("network_drops_v7", JSON.stringify(counts));
        } catch (e) {}
    }

    function getFormattedDate() {
        var options = { year: "numeric", month: "long", day: "numeric" };
        return new Date().toLocaleDateString("en-US", options);
    }

    function updateScreen() {
        var allBtns = document.querySelectorAll(".room-btn");
        for (var i = 0; i < allBtns.length; i++) {
            var btn = allBtns[i];
            var id = btn.getAttribute("data-id");
            btn.textContent = roomNames[id] + " (" + counts[id] + ")";
            if (id === selectedId) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        }

        var currentName = roomNames[selectedId];
        var currentCount = counts[selectedId];
        document.getElementById("selectedTitle").textContent = "Selected: " + currentName + " (" + currentCount + " Ethernet Drops)";
        document.getElementById("btnRemove").disabled = (currentCount === 0);

        var view = document.getElementById("dropsView");
        view.innerHTML = "";
        if (currentCount === 0) {
            view.innerHTML = "<span style='color:#94a3b8; font-style:italic;'>No Ethernet Drops registered in " + currentName + " yet.</span>";
        } else {
            for (var j = 1; j <= currentCount; j++) {
                var card = document.createElement("div");
                card.className = "drop-card";
                card.textContent = "Ethernet Drop #" + (j < 10 ? "0" + j : j);
                view.appendChild(card);
            }
        }

        var dateText = getFormattedDate();
        document.getElementById("reportTitle").textContent = "Network Infrastructure Report \u2014 " + dateText;

        var tbody = document.getElementById("reportBody");
        tbody.innerHTML = "";
        var total = 0;

        for (var m = 0; m < roomKeys.length; m++) {
            var rKey = roomKeys[m];
            var c = counts[rKey];
            total += c;
            var tr = document.createElement("tr");
            tr.innerHTML = "<td>" + roomNames[rKey] + "</td><td class='num'>" + c + "</td>";
            tbody.appendChild(tr);
        }

        var trTotal = document.createElement("tr");
        trTotal.className = "total-row";
        trTotal.innerHTML = "<td>TOTAL ETHERNET DROPS</td><td class='num'>" + total + "</td>";
        tbody.appendChild(trTotal);
    }

    document.getElementById("roomMenu").addEventListener("click", function(e) {
        var btn = e.target.closest(".room-btn");
        if (btn) {
            selectedId = btn.getAttribute("data-id");
            updateScreen();
        }
    });

    document.getElementById("btnAdd").addEventListener("click", function() {
        counts[selectedId] += 1;
        saveLocal();
        updateScreen();
    });

    document.getElementById("btnRemove").addEventListener("click", function() {
        if (counts[selectedId] > 0) {
            counts[selectedId] -= 1;
            saveLocal();
            updateScreen();
        }
    });

    document.getElementById("btnDownload").addEventListener("click", function() {
        window.print();
    });

    updateScreen();
</script>

</body>
</html>
