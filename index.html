<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Infrastructure Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; margin: 0; }
        .box { width: 100%; max-width: 900px; background: #1e293b; padding: 24px; border-radius: 10px; border: 1px solid #334155; }
        h1 { margin: 0 0 6px 0; font-size: 22px; }
        .subtitle { color: #94a3b8; margin: 0 0 20px 0; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .room-btn { padding: 13px 14px; background: #334155; color: #f8fafc; border: 2px solid #475569; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: left; font-size: 14px; transition: 0.15s; }
        .room-btn:hover { background: #475569; }
        .room-btn.active { background: #2563eb; border-color: #93c5fd; }
        .panel { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
        .add-btn { padding: 14px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .add-btn:hover { background: #15803d; }
        .rem-btn { padding: 14px; background: #dc2626; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .rem-btn:hover:not(:disabled) { background: #b91c1c; }
        .rem-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.6; }
        .drops-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
        .drop-card { background: #1e293b; padding: 10px 12px; border-radius: 6px; border: 1px solid #334155; font-size: 14px; }
        .report-box { background: #0f172a; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        .report-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
        .download-btn { padding: 12px 24px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .download-btn:hover { background: #0369a1; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #334155; text-align: left; }
        th { background: #1e293b; color: #cbd5e1; }
        td.num, th.num { text-align: right; }
        tr.total-row td { background: #1e293b; font-weight: bold; color: #38bdf8; border-top: 2px solid #475569; }
    </style>
</head>
<body>

<div class="box">
    <h1>Network Infrastructure Manager</h1>
    <p class="subtitle">Select a location below, then add or remove Ethernet Drops.</p>

    <div class="grid" id="roomMenu">
        <button type="button" class="room-btn active" onclick="selectRoom('Classroom 1', this)">Classroom 1 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 2', this)">Classroom 2 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 3', this)">Classroom 3 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 4', this)">Classroom 4 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 5', this)">Classroom 5 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 6', this)">Classroom 6 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 7', this)">Classroom 7 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 8', this)">Classroom 8 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 9', this)">Classroom 9 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 10', this)">Classroom 10 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 11', this)">Classroom 11 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 12', this)">Classroom 12 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 13', this)">Classroom 13 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Classroom 14', this)">Classroom 14 (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Teachers\' Lounge', this)">Teachers' Lounge (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Secretariat Office', this)">Secretariat Office (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Fernanda / Roberval Office', this)">Fernanda / Roberval Office (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Talita / Julio Office', this)">Talita / Julio Office (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Rogério / Ana Office', this)">Rogério / Ana Office (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Principal\'s Office', this)">Principal's Office (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('PROATI Room', this)">PROATI Room (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Resource Room', this)">Resource Room (0)</button>
        <button type="button" class="room-btn" onclick="selectRoom('Appendice Room', this)">Appendice Room (0)</button>
    </div>

    <div class="panel">
        <h2 id="selectedTitle" style="margin:0; font-size: 18px;">Selected: Classroom 1 (0 Ethernet Drops)</h2>
        <div class="actions">
            <button type="button" class="add-btn" onclick="changeDrops(1)">+ Add Ethernet Drop</button>
            <button type="button" class="rem-btn" id="removeBtn" onclick="changeDrops(-1)" disabled>- Remove Ethernet Drop</button>
        </div>
        <div class="drops-grid" id="dropsView"></div>
    </div>

    <div class="report-box">
        <div class="report-header">
            <h3 id="reportTitle" style="margin:0; font-size: 16px;">Network Infrastructure Report</h3>
            <button type="button" class="download-btn" onclick="downloadPDF()">Download</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Location</th>
                    <th class="num">Ethernet Drops</th>
                </tr>
            </thead>
            <tbody id="reportBody"></tbody>
        </table>
    </div>
</div>

<script>
    var rooms = [
        "Classroom 1", "Classroom 2", "Classroom 3", "Classroom 4", "Classroom 5",
        "Classroom 6", "Classroom 7", "Classroom 8", "Classroom 9", "Classroom 10",
        "Classroom 11", "Classroom 12", "Classroom 13", "Classroom 14",
        "Teachers' Lounge",
        "Secretariat Office",
        "Fernanda / Roberval Office",
        "Talita / Julio Office",
        "Rogério / Ana Office",
        "Principal's Office",
        "PROATI Room",
        "Resource Room",
        "Appendice Room"
    ];

    var counts = {};
    for (var i = 0; i < rooms.length; i++) {
        counts[rooms[i]] = 0;
    }

    try {
        var saved = localStorage.getItem("network_drops_v5");
        if (saved) {
            var parsed = JSON.parse(saved);
            for (var k = 0; k < rooms.length; k++) {
                if (typeof parsed[rooms[k]] === "number") {
                    counts[rooms[k]] = parsed[rooms[k]];
                }
            }
        }
    } catch (e) {}

    var selectedRoom = "Classroom 1";

    function saveLocal() {
        try {
            localStorage.setItem("network_drops_v5", JSON.stringify(counts));
        } catch (e) {}
    }

    function getFormattedDate() {
        var options = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date().toLocaleDateString('en-US', options);
    }

    function selectRoom(roomName, btnElement) {
        selectedRoom = roomName;
        var allBtns = document.querySelectorAll(".room-btn");
        for (var i = 0; i < allBtns.length; i++) {
            allBtns[i].classList.remove("active");
        }
        if (btnElement) {
            btnElement.classList.add("active");
        }
        updateScreen();
    }

    function updateScreen() {
        var allBtns = document.querySelectorAll(".room-btn");
        for (var i = 0; i < rooms.length; i++) {
            var r = rooms[i];
            if (allBtns[i]) {
                allBtns[i].textContent = r + " (" + counts[r] + ")";
                if (r === selectedRoom) {
                    allBtns[i].classList.add("active");
                } else {
                    allBtns[i].classList.remove("active");
                }
            }
        }

        var currentCount = counts[selectedRoom];
        document.getElementById("selectedTitle").textContent = "Selected: " + selectedRoom + " (" + currentCount + " Ethernet Drops)";
        document.getElementById("removeBtn").disabled = (currentCount === 0);

        var view = document.getElementById("dropsView");
        view.innerHTML = "";
        if (currentCount === 0) {
            view.innerHTML = "<span style='color:#94a3b8; font-style:italic;'>No Ethernet Drops registered in " + selectedRoom + " yet.</span>";
        } else {
            for (var j = 1; j <= currentCount; j++) {
                var card = document.createElement("div");
                card.className = "drop-card";
                card.textContent = "Ethernet Drop #" + (j < 10 ? "0" + j : j);
                view.appendChild(card);
